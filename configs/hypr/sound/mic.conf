# Ricelin mic noise filter: RNNoise as a smart filter behind the default input, so every app records the cleaned signal.
context.properties = { log.level = 0 }
context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}
context.modules = [
    { name = libpipewire-module-rt args = { } flags = [ ifexists nofail ] }
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "Ricelin Mic"
            media.name = "Ricelin Mic"
            filter.graph = {
                nodes = [
                    {
                        type = ladspa
                        name = rnnoise
                        plugin = "librnnoise_ladspa"
                        label = noise_suppressor_mono
                        control = { "VAD Threshold (%)" = 50.0 "VAD Grace Period (ms)" = 200 }
                    }
                ]
            }
            audio.rate = 48000
            audio.position = [ MONO ]
            capture.props = {
                node.name = "ricelin_mic.in"
                node.passive = true
            }
            playback.props = {
                node.name = "ricelin_mic"
                media.class = Audio/Source
                filter.smart = true
                filter.smart.name = "ricelin-mic"
            }
        }
    }
]
