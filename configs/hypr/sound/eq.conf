                { type = builtin name = ra8 label = bq_raw config = { coefficients = [ { rate = 48000 b0 = 1.0 b1 = 0.0 b2 = 0.0 a0 = 1.0 a1 = 0.0 a2 = 0.0 } ] } }
                { type = builtin name = ra9 label = bq_raw config = { coefficients = [ { rate = 48000 b0 = 1.0 b1 = 0.0 b2 = 0.0 a0 = 1.0 a1 = 0.0 a2 = 0.0 } ] } }
                { type = builtin name = rb label = bq_lowshelf control = { "Freq" = 100.0 "Q" = 0.7 "Gain" = 0.0 } }
                { type = builtin name = r0 label = bq_peaking control = { "Freq" = 31.0 "Q" = 1.41 "Gain" = 0.0 } }
                { type = builtin name = r1 label = bq_peaking control = { "Freq" = 62.0 "Q" = 1.41 "Gain" = 0.0 } }
