# Ricelin EQ: AutoEQ biquads, 10-band EQ with bass/treble shelves, night leveling and widen, run as a smart filter the pill drives through pw-cli set-param.
context.properties = { log.level = 0 }
context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}
context.modules = [
    { name = libpipewire-module-rt args = { } flags = [ ifexists nofail ] }
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "Ricelin EQ"
            media.name = "Ricelin EQ"
            filter.graph = {
                nodes = [
                { type = builtin name = la0 label = bq_raw config = { coefficients = [ { rate = 48000 b0 = 1.0 b1 = 0.0 b2 = 0.0 a0 = 1.0 a1 = 0.0 a2 = 0.0 } ] } }
                { type = builtin name = la1 label = bq_raw config = { coefficients = [ { rate = 48000 b0 = 1.0 b1 = 0.0 b2 = 0.0 a0 = 1.0 a1 = 0.0 a2 = 0.0 } ] } }
