                { type = builtin name = nr label = linear control = { "Mult" = 1.0 "Add" = 0.0 } }
                { type = builtin name = dr label = mixer control = { "Gain 1" = 1.0 "Gain 2" = 0.0 } }
                { type = ebur128 name = lu label = ebur128 }
                { type = ebur128 name = lg label = lufs2gain control = { "Target LUFS" = -18.0 } }
                { type = builtin name = cg label = clamp control = { "Min" = 0.25 "Max" = 2.8 } }
                { type = builtin name = wl label = mixer control = { "Gain 1" = 1.0 "Gain 2" = 0.0 } }
                { type = builtin name = wr label = mixer control = { "Gain 1" = 1.0 "Gain 2" = 0.0 } }
                ]
                links = [
                { output = "la0:Out" input = "la1:In" }
                { output = "la1:Out" input = "la2:In" }
                { output = "la2:Out" input = "la3:In" }
                { output = "la3:Out" input = "la4:In" }
                { output = "la4:Out" input = "la5:In" }
                { output = "la5:Out" input = "la6:In" }
