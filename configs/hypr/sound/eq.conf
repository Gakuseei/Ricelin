                { output = "lg:Gain" input = "cg:Control" }
                { output = "cg:Notify" input = "nl:Mult" }
                { output = "cg:Notify" input = "nr:Mult" }
                { output = "dl:Out" input = "wl:In 1" }
                { output = "dr:Out" input = "wl:In 2" }
                { output = "dr:Out" input = "wr:In 1" }
                { output = "dl:Out" input = "wr:In 2" }
                ]
                inputs = [ "la0:In" "ra0:In" ]
                outputs = [ "wl:Out" "wr:Out" ]
            }
            audio.rate = 48000
            audio.channels = 2
            audio.position = [ FL FR ]
            capture.props = {
                node.name = "ricelin_eq"
                media.class = Audio/Sink
                filter.smart = true
                filter.smart.name = "ricelin-eq"
            }
            playback.props = {
                node.name = "ricelin_eq.out"
                node.passive = true
                stream.dont-remix = true
            }
